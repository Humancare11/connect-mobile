name: humancare_connect
description: "GlobaL Health Passport"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_stripe: ^13.0.0
  flutter_webrtc: ^1.0.0
  file_picker: ^10.3.2
  google_fonts: ^6.2.1
  google_sign_in: ^7.1.1
  http: ^1.2.1
  shared_preferences: ^2.2.2
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4

  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.2
  # Android-only: runs the mediaProjection foreground service screen sharing
  # requires (see android/app/src/main/AndroidManifest.xml). No-op on iOS,
  # which doesn't need it — see video_call_controller.dart's screen-sharing
  # section.
  flutter_background: ^1.3.1
  # Runtime permission requests (Android 12+ requires BLUETOOTH_CONNECT to be
  # granted explicitly, unlike the legacy BLUETOOTH permission it replaces —
  # see video_call_controller.dart's call-start sequence).
  permission_handler: ^11.3.1
  # Device-level connectivity-loss detection for the video call screen —
  # mirrors VideoCall.jsx's window online/offline listeners, which have no
  # direct Flutter equivalent.
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Logo.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.uat
    - .env.production
    - assets/
