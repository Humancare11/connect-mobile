
name: humancare_connect
description: "GlobaL Health Passport"
publish_to: 'none'

version: 1.0.0+10

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_stripe: ^13.0.0
  flutter_webrtc: ^1.0.0
  file_picker: ^10.3.2
  google_fonts: ^6.2.1
  google_sign_in: ^7.1.1
  http: ^1.2.1
  shared_preferences: ^2.2.2
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4

  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.2
  # Runtime permission requests (Android 12+ requires BLUETOOTH_CONNECT to be
  # granted explicitly, unlike the legacy BLUETOOTH permission it replaces —
  # see video_call_controller.dart's call-start sequence).
  permission_handler: ^11.3.1
  # Device-level connectivity-loss detection for the video call screen —
  # mirrors VideoCall.jsx's window online/offline listeners, which have no
  # direct Flutter equivalent.
  connectivity_plus: ^6.1.5
  # Opens the privacy policy link from the Account screen in an external
  # browser (Play Store requires a reachable privacy policy).
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo-2.png"
  # Android 8+ adaptive icon. Without these two keys, flutter_launcher_icons
  # only emits the legacy square mipmap/ic_launcher.png (what's shipping
  # today) — no mipmap-anydpi-v26/ic_launcher.xml, so launchers on real
  # devices fall back to auto-generating their own mask from that square
  # image, which is a common source of odd cropping. adaptive_icon_foreground
  # reuses the existing logo unchanged; adaptive_icon_foreground_inset raises
  # padding from the plugin's 16% default to keep this specific logo — a
  # wide wordmark with little internal margin of its own — safely inside the
  # 66dp/108dp safe zone on a circular mask, not just a rounded-square one.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo-2.png"
  adaptive_icon_foreground_inset: 20

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/

  # Bundled rather than pulled at runtime through google_fonts: a downloaded
  # font renders as the platform fallback (Roboto) until it arrives, so weights
  # and metrics differed from the design on first launch and on any device
  # without network. Bundling makes the first frame correct and offline-safe.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
